<!DOCTYPE html>
<html>
<head>
    <script src="https://assets.adobedtm.com/de3a66fdc88b/d3a37b848c09/launch-c883f2bbcc3c-development.min.js" async></script>
    <title>Customer Registration</title>

    <style>
        body{
            background-color: skyblue;
            font-family: Arial, sans-serif;
        }

        .form-container{
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button{
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Demo Store</h2>

    <h3>Laptop</h3>

    <button id="addToCartBtn">
        Add To Cart
        
    </button>

    <hr>

    <h2>Customer Registration Form</h2>

    <form id="registrationForm">

        <input type="text"
               id="firstName"
               placeholder="First Name">

        <input type="email"
               id="email"
               placeholder="Email">

        <input type="text"
               id="city"
               placeholder="City">

        <input type="tel"
               id="phone"
               placeholder="Phone Number">

        <button type="submit"
                id="registerBtn">
            Register
        </button>

    </form>
</div>
    <script>
document.getElementById("addToCartBtn").addEventListener("click", function() {

    alloy("sendEvent", {
        xdm: {
            eventType: "commerce.productListAdds",
            productListItems: [{
                name: "Laptop",
                SKU: "LP1001",
                quantity: 1,
                priceTotal: 50000
            }]
        }
    });

    console.log("Laptop added to cart");

});
</script>


</body>
</html>

</body>
</html>
